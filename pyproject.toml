[tool.poetry]
name = "mle-f2-tech-challenge"
version = "0.1.0"
description = "E-commerce product recommendation system — FIAP MLE Phase 2"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
torch = ">=2.2.0"
scikit-learn = ">=1.4.0"
mlflow = ">=2.12.0"
protobuf = ">=3.12,<4"
dvc = ">=3.50.0"
pydantic-settings = ">=2.2.0"
pyyaml = ">=6.0.1"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
pyarrow = ">=15.0.0"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0"
mypy = ">=1.10.0"
kaggle = ">=1.6.0"
pre-commit = ">=3.7.0"
ipykernel = ">=6.29.0"
jupyterlab = ">=4.1.0"
seaborn = ">=0.13.0"
scipy = ">=1.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN", "D", "C90"]
ignore = [
    "ANN101",  # self sem type hint
    "ANN102",  # cls sem type hint
    "ANN401",  # Any em interfaces abstratas é intencional
    "N803",    # X, y são convenção ML para matrizes
    "N806",    # X_train, X_test são convenção ML
    "D100",    # docstring em módulo público
    "D104",    # docstring em pacote público
    "D107",    # docstring em __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
"scripts/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
no_strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
