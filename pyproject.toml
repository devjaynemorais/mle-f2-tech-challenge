[project]
name = "mle-f2-tech-challenge"
version = "0.1.0"
description = "E-commerce product recommendation system — FIAP MLE Phase 2"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4.0",
    "mlflow>=2.12.0",
    "dvc>=3.50.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "seaborn>=0.13.2",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
    "implicit>=0.7.3",
    "mlxtend>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
