services:
  mlflow:
    build:
      context: .
      target: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlartifacts:/mlartifacts
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  train:
    build:
      context: .
      target: runtime
    command: src.training.trainer
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - ml-network

  evaluate:
    build:
      context: .
      target: runtime
    command: src.evaluation.evaluate
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - ml-network
    profiles:
      - eval

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./models:/app/models
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge
