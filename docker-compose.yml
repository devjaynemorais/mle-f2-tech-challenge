services:
  mlflow:
    build:
      context: .
      target: mlflow-server
    ports:
      # porta do host parametrizável para evitar conflitos (padrão 5000)
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./mlartifacts:/mlartifacts
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  train:
    build:
      context: .
      target: runtime
    command: src.training.trainer
    env_file: .env
    environment:
      # dentro da rede compose o servidor MLflow é acessível pelo nome do serviço
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - ml-network

  evaluate:
    build:
      context: .
      target: runtime
    command: src.evaluation.evaluate
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - ml-network
    profiles:
      - eval

  promote:
    build:
      context: .
      target: runtime
    command: src.models.registry
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - ml-network
    profiles:
      - promote

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./data:/app/data:ro
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  ml-network:
    driver: bridge
