stages:
  preprocess:
    cmd: python -m src.data.preprocess
    deps:
      - src/data/preprocess.py
      - src/data/preprocessor.py
      - data/raw/events.csv
    params:
      - preprocess
    outs:
      - data/interim/

  content:
    cmd: python -m src.data.content_etl
    deps:
      - src/data/content_etl.py
      - data/raw/item_properties_part1.csv
      - data/raw/item_properties_part2.csv
    outs:
      - data/content/

  feature_eng:
    cmd: python -m src.features.build_features
    deps:
      - src/features/build_features.py
      - src/data/feature_engineering.py
      - src/data/feature_contract.py
      - data/interim/
      - data/content/
    params:
      - preprocess
      - feature_eng
    outs:
      - data/processed/

  train:
    cmd: python -m src.training.trainer
    deps:
      - src/training/trainer.py
      - src/models/
      - src/data/labeling.py
      - src/data/dataset.py
      - src/data/feature_contract.py
      - src/evaluation/ranking.py
      - src/evaluation/scorers.py
      - data/processed/
    params:
      - train
      - labeling
      - eval
    outs:
      - models/artifacts/
    metrics:
      - metrics/train_metrics.json:
          cache: false

  evaluate:
    cmd: python -m src.evaluation.evaluate
    deps:
      - src/evaluation/evaluate.py
      - src/evaluation/ranking.py
      - src/evaluation/scorers.py
      - src/data/labeling.py
      - src/data/feature_contract.py
      - models/artifacts/
      - data/processed/
    params:
      - labeling
      - eval
    metrics:
      - metrics/eval_metrics.json:
          cache: false
    plots:
      - metrics/plots/:
          cache: false

  promote:
    cmd: python -m src.models.registry
    deps:
      - src/models/registry.py
      - src/utils/mlflow_tracking.py
      - metrics/train_metrics.json
      - metrics/eval_metrics.json
    params:
      - registry
      - mlflow
    outs:
      - models/promoted_model.json:
          cache: false
